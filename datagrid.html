<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Grid - Red Black</title>
    <style>
        :root {
            --accent: #ff3333;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #ffffff;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 15px;
        }

        .brand-title {
            color: var(--accent);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        label {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }

        select {
            background-color: #262626;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            min-width: 180px;
        }

        select:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .btn-secondary {
            color: #aaaaaa;
            border-color: #444444;
        }

        .btn-secondary:hover {
            background-color: #444444;
            color: #ffffff;
        }

        /* Table */
        #excelTable {
            border-collapse: collapse;
            background: #262626;
            width: 100%;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            table-layout: fixed;
            overflow: auto;
            min-height: 0;
        }

        th, td {
            border: 1px solid #444444;
            text-align: center;
            font-size: 12px;
            padding: 0;
            min-width: 90px;
        }

        th {
            background-color: #111111;
            font-weight: bold;
            color: var(--accent);
            height: 28px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr th:first-child {
            background-color: #111111;
            width: 40px;
            left: 0;
            z-index: 11;
        }

        td input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: #ffffff;
            padding: 4px 8px;
            font-size: 12px;
            text-align: left;
            box-sizing: border-box;
        }

        td input:focus {
            outline: 2px solid var(--accent);
            background-color: #333333;
        }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="brand-title">Data Grid</div>
        
        <div class="controls">
            <label>Select Grid:</label>
            <select id="gridSelector" onchange="loadSelectedGrid()"></select>
            
            <button class="btn" onclick="saveCurrentGridAs()">Save As</button>
            <button class="btn btn-secondary" onclick="renameCurrentGrid()">Rename</button>
            <button class="btn btn-secondary" onclick="deleteCurrentGrid()">Delete Grid</button>
            <button class="btn btn-secondary" onclick="clearGridFields()">Clear</button>
        </div>
    </div>

    <table id="excelTable">
        <thead>
            <tr>
                <th></th>
                <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th>
                <th>F</th><th>G</th><th>H</th><th>I</th><th>J</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <footer>
        © 2026 Double Trouble Studios. All rights reserved.
    </footer>

    <script>
        const totalRows = 20;
        const columns = ['A','B','C','D','E','F','G','H','I','J'];
        let currentGridKey = 'grid_default';

        const tableBody = document.getElementById('tableBody');
        const selector = document.getElementById('gridSelector');

        function createGrid() {
            tableBody.innerHTML = '';
            for (let i = 1; i <= totalRows; i++) {
                let row = document.createElement('tr');
                
                let rowHeader = document.createElement('th');
                rowHeader.textContent = i;
                row.appendChild(rowHeader);

                columns.forEach(col => {
                    let td = document.createElement('td');
                    let input = document.createElement('input');
                    input.type = 'text';
                    input.dataset.cell = `${col}${i}`;

                    input.addEventListener('input', debounce(saveToStorage, 300));

                    td.appendChild(input);
                    row.appendChild(td);
                });

                tableBody.appendChild(row);
            }
        }

        function debounce(func, delay) {
            let timeout;
            return function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(), delay);
            };
        }

        function saveToStorage() {
            const inputs = document.querySelectorAll('td input');
            let gridData = {};
            inputs.forEach(input => {
                if (input.value.trim() !== '') {
                    gridData[input.dataset.cell] = input.value;
                }
            });
            localStorage.setItem(currentGridKey, JSON.stringify(gridData));
        }

        function saveCurrentGridAs() {
            let name = prompt("Enter name for the new grid:");
            if (!name || name.trim() === "") return;

            let cleanName = name.trim();
            let newKey = 'grid_' + Date.now();

            let gridList = JSON.parse(localStorage.getItem('grid_list')) || {};
            gridList[newKey] = cleanName;
            localStorage.setItem('grid_list', JSON.stringify(gridList));

            currentGridKey = newKey;
            saveToStorage();
            updateDropdown();
            selector.value = newKey;
        }

        function renameCurrentGrid() {
            if (currentGridKey === 'grid_default') {
                alert("The default grid cannot be renamed.");
                return;
            }

            let gridList = JSON.parse(localStorage.getItem('grid_list')) || {};
            let currentName = gridList[currentGridKey] || "Untitled";

            let newName = prompt("Enter new name for the grid:", currentName);
            if (!newName || newName.trim() === "" || newName === currentName) return;

            gridList[currentGridKey] = newName.trim();
            localStorage.setItem('grid_list', JSON.stringify(gridList));

            updateDropdown();
            selector.value = currentGridKey;
        }

        function loadSelectedGrid() {
            currentGridKey = selector.value || 'grid_default';
            clearTableFieldsOnly();

            let rawData = localStorage.getItem(currentGridKey);
            if (rawData) {
                let gridData = JSON.parse(rawData);
                document.querySelectorAll('td input').forEach(input => {
                    const cell = input.dataset.cell;
                    input.value = gridData[cell] || '';
                });
            }
        }

        function updateDropdown() {
            selector.innerHTML = '<option value="grid_default">Default Grid</option>';

            let gridList = JSON.parse(localStorage.getItem('grid_list')) || {};
            for (let key in gridList) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.textContent = gridList[key];
                selector.appendChild(opt);
            }
        }

        function clearTableFieldsOnly() {
            document.querySelectorAll('td input').forEach(input => input.value = '');
        }

        function clearGridFields() {
            if (confirm("Clear all cells in this grid?")) {
                clearTableFieldsOnly();
                saveToStorage();
            }
        }

        function deleteCurrentGrid() {
            if (currentGridKey === 'grid_default') {
                alert("The default grid cannot be deleted.");
                return;
            }

            if (confirm("Are you sure you want to permanently delete this grid?")) {
                localStorage.removeItem(currentGridKey);

                let gridList = JSON.parse(localStorage.getItem('grid_list')) || {};
                delete gridList[currentGridKey];
                localStorage.setItem('grid_list', JSON.stringify(gridList));

                currentGridKey = 'grid_default';
                updateDropdown();
                selector.value = 'grid_default';
                loadSelectedGrid();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            createGrid();
            updateDropdown();
            loadSelectedGrid();
        });
    </script>
</body>
</html>
